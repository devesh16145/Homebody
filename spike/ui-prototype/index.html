<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sandbox-ai prototype</title>
<style>
/* ---------- tokens ---------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
  --desktop: linear-gradient(160deg, #c7d4ee 0%, #dcc7e6 45%, #f2d9c8 100%);
  --menubar-bg: rgba(255,255,255,.55);
  --menubar-fg: #1d1d1f;
  --window-bg: #f6f6f7;
  --titlebar-bg: #ebebed;
  --panel: #ffffff;
  --panel-2: #f1f1f3;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #8e8e93;
  --hairline: rgba(0,0,0,.10);
  --hairline-strong: rgba(0,0,0,.18);
  --accent: #007aff;
  --green: #34c759;
  --amber: #ff9f0a;
  --red: #ff3b30;
  --blue: #0a84ff;
  --gray: #8e8e93;
  --popover-bg: rgba(246,246,248,.78);
  --shadow-lg: 0 18px 50px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.18);
  --shadow-sm: 0 6px 24px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.12);
  --btn-bg: #ffffff;
  --btn-border: rgba(0,0,0,.15);
  --chip-bg: rgba(0,0,0,.05);
  --row-hover: rgba(0,0,0,.04);
  --selected: rgba(0,122,255,.12);
  --code-bg: #1e1e20;
  --code-fg: #d8d8dc;
  --knob: #ffffff;
  --track-off: rgba(120,120,128,.32);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desktop: linear-gradient(160deg, #1a2140 0%, #2b1e3e 45%, #3a2a2b 100%);
    --menubar-bg: rgba(28,28,30,.62);
    --menubar-fg: #f5f5f7;
    --window-bg: #1f1f21;
    --titlebar-bg: #2a2a2c;
    --panel: #272729;
    --panel-2: #303032;
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #7c7c80;
    --hairline: rgba(255,255,255,.10);
    --hairline-strong: rgba(255,255,255,.20);
    --accent: #0a84ff;
    --green: #30d158;
    --amber: #ffd60a;
    --red: #ff453a;
    --popover-bg: rgba(44,44,46,.74);
    --btn-bg: #3a3a3c;
    --btn-border: rgba(255,255,255,.14);
    --chip-bg: rgba(255,255,255,.08);
    --row-hover: rgba(255,255,255,.05);
    --selected: rgba(10,132,255,.28);
    --code-bg: #141416;
    --code-fg: #d8d8dc;
    --track-off: rgba(120,120,128,.40);
  }
}
:root[data-theme="dark"] {
  --desktop: linear-gradient(160deg, #1a2140 0%, #2b1e3e 45%, #3a2a2b 100%);
  --menubar-bg: rgba(28,28,30,.62);
  --menubar-fg: #f5f5f7;
  --window-bg: #1f1f21;
  --titlebar-bg: #2a2a2c;
  --panel: #272729;
  --panel-2: #303032;
  --text: #f5f5f7;
  --text-2: #a1a1a6;
  --text-3: #7c7c80;
  --hairline: rgba(255,255,255,.10);
  --hairline-strong: rgba(255,255,255,.20);
  --accent: #0a84ff;
  --green: #30d158;
  --amber: #ffd60a;
  --red: #ff453a;
  --popover-bg: rgba(44,44,46,.74);
  --btn-bg: #3a3a3c;
  --btn-border: rgba(255,255,255,.14);
  --chip-bg: rgba(255,255,255,.08);
  --row-hover: rgba(255,255,255,.05);
  --selected: rgba(10,132,255,.28);
  --code-bg: #141416;
  --code-fg: #d8d8dc;
  --track-off: rgba(120,120,128,.40);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 13px/1.4 var(--font);
  color: var(--text);
  background: var(--desktop);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: default; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible + .track {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}
h2, h3, p { margin: 0; }
.cap { font-size: 11px; color: var(--text-3); }
.muted { color: var(--text-2); }

/* ---------- menu bar ---------- */
.menubar {
  position: fixed; inset: 0 0 auto 0; height: 25px; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px 0 14px;
  background: var(--menubar-bg);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  color: var(--menubar-fg);
  font-size: 13px; user-select: none;
}
.mb-left, .mb-right { display: flex; align-items: center; gap: 18px; }
.mb-left b { font-weight: 700; margin-right: 2px; }
.mb-left .apple { font-size: 15px; margin-right: -6px; }
.mb-right { gap: 12px; }
.mb-glyph svg { width: 16px; height: 16px; display: block; fill: currentColor; }
.mb-clock { font-variant-numeric: tabular-nums; }
.statusitem {
  display: flex; align-items: center; justify-content: center;
  height: 22px; width: 30px; border: 0; border-radius: 4px; background: transparent;
}
.statusitem[aria-expanded="true"] { background: rgba(127,127,127,.25); }
.dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--gray);
  box-shadow: 0 0 0 1.5px rgba(255,255,255,.35) inset;
  transition: background .25s;
}
.dot.green { background: var(--green); box-shadow: 0 0 6px rgba(52,199,89,.6); }
.dot.amber { background: var(--amber); box-shadow: 0 0 6px rgba(255,159,10,.6); }
.dot.red   { background: var(--red);   box-shadow: 0 0 6px rgba(255,59,48,.6); }
.dot.blue  { background: transparent; box-shadow: 0 0 0 2px var(--blue) inset; }
.dot.gray  { background: var(--gray); }

/* ---------- popover (Glance) ---------- */
.popover {
  position: fixed; top: 32px; width: 320px; z-index: 60;
  padding: 12px; border-radius: 10px;
  background: var(--popover-bg);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateY(-6px) scale(.98); visibility: hidden;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.popover.open { opacity: 1; transform: none; visibility: visible; }
.popover::before {
  content: ""; position: absolute; top: -6px; left: var(--arrow-x, 50%);
  width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg);
  background: var(--popover-bg); border-radius: 2px;
  box-shadow: -1px -1px 0 0 rgba(0,0,0,.08);
}
.g-status { display: flex; align-items: center; gap: 8px; padding: 2px 2px 10px; font-weight: 600; }
.g-status .dot { flex: none; }
.g-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 2px; }
.g-row > span:first-child { flex: 1; min-width: 0; padding-right: 12px; }
.g-row .lbl { font-size: 13px; }
.g-row .sub { font-size: 11px; color: var(--text-3); }
.g-sep { height: 1px; background: var(--hairline); margin: 6px -4px; }
.g-head { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 6px 2px 2px; letter-spacing: .02em; }
.g-ev { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 6px; font-size: 12px; }
.g-ev:hover { background: var(--row-hover); }
.g-ev .verb { width: 52px; flex: none; }
.g-ev .what { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.g-ev .time { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.g-empty { font-size: 12px; color: var(--text-3); padding: 6px 4px; }
.g-foot { display: flex; align-items: center; gap: 8px; padding-top: 8px; }
.g-foot .btn { flex: 1; }
.g-foot .gear { flex: none; width: 28px; height: 26px; padding: 0; display: grid; place-items: center; }
.g-foot .gear svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.g-cta { margin-top: 4px; }
.g-cta .btn { width: 100%; }

/* ---------- switch ---------- */
.switch { position: relative; display: inline-flex; align-items: center; flex: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch.sm .track { width: 30px; height: 18px; }
.switch.sm .track::after { width: 14px; height: 14px; }
.switch.sm input:checked + .track::after { transform: translateX(12px); }
.track {
  width: 38px; height: 22px; border-radius: 11px; background: var(--track-off);
  position: relative; transition: background .2s;
}
.track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--knob); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch.green input:checked + .track { background: var(--green); }
.switch input:disabled + .track { opacity: .45; }

/* ---------- buttons & chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 26px; padding: 3px 12px; border-radius: 6px;
  background: var(--btn-bg); border: 1px solid var(--btn-border);
  box-shadow: 0 .5px 1px rgba(0,0,0,.08); font-size: 13px; white-space: nowrap;
}
.btn:hover { filter: brightness(.97); }
.btn:active { filter: brightness(.92); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.sm { min-height: 22px; font-size: 12px; padding: 2px 10px; }
.btn[disabled] { opacity: .5; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hairline);
  background: var(--chip-bg);
}
.chip.active { background: var(--accent); color: #fff; border-color: transparent; }

/* ---------- window ---------- */
.desktop { position: absolute; inset: 25px 0 0 0; display: grid; place-items: start center; padding-top: 44px; }
.window {
  position: relative; width: 800px; max-width: calc(100vw - 32px); height: 560px; max-height: calc(100vh - 120px);
  border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  background: var(--window-bg); box-shadow: var(--shadow-lg);
}
.titlebar {
  flex: none; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: var(--titlebar-bg); border-bottom: 1px solid var(--hairline); user-select: none;
}
.lights { display: flex; gap: 8px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
.lights .r { background: #ff5f57; } .lights .y { background: #febc2e; } .lights .g { background: #28c840; }
.wtitle { font-weight: 600; font-size: 13px; white-space: nowrap; }
.seg { margin: 0 auto; display: flex; padding: 2px; border-radius: 7px; background: var(--chip-bg); }
.seg button {
  border: 0; background: transparent; border-radius: 5px; padding: 3px 14px; font-size: 13px; color: var(--text-2);
}
.seg button[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tb-spacer { width: 110px; }
.content { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 22px; }
.content.flush { padding: 0; }

/* ---------- Feed ---------- */
.group { margin-top: 14px; }
.group-h { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 4px 10px 6px; }
.appicon {
  width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center;
  font-size: 9px; font-weight: 700; color: #fff; letter-spacing: -.02em; flex: none;
  box-shadow: 0 0 0 .5px var(--hairline-strong);
}
.appicon.lg { width: 36px; height: 36px; border-radius: 9px; font-size: 14px; }
.event {
  display: grid; grid-template-columns: 62px 1fr auto 96px; gap: 10px; align-items: center;
  padding: 7px 10px; border-radius: 7px; width: 100%; border: 0; background: transparent; text-align: left;
}
.event:hover { background: var(--row-hover); }
.event[aria-expanded="true"] { background: var(--selected); }
.verb { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; display: inline-block; text-align: center; }
.verb.Blocked { color: var(--red); background: rgba(255,59,48,.12); }
.verb.Allowed { color: var(--green); background: rgba(52,199,89,.14); }
.verb.Asked   { color: var(--amber); background: rgba(255,159,10,.16); }
.verb.Seen    { color: var(--blue); background: rgba(10,132,255,.14); }
.event .dest { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.event .bytes { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.event .time { font-size: 12px; color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.expand { padding: 4px 10px 12px 82px; color: var(--text-2); animation: fade .15s ease; }
.expand .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.expand .undo { margin-left: auto; color: var(--accent); background: transparent; border: 0; padding: 0 4px; }
.empty { color: var(--text-3); text-align: center; padding: 60px 0; }
@keyframes fade { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }

/* ---------- Proof ---------- */
.hero { text-align: center; padding: 26px 0 10px; }
.hero .streak { font-size: 34px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
.hero .since { color: var(--text-2); margin-top: 6px; }
.stats { display: flex; gap: 12px; justify-content: center; margin: 22px 0 18px; }
.stat { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px; padding: 12px 18px; min-width: 150px; text-align: center; }
.stat .num { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.proof-apps { display: flex; justify-content: center; gap: 8px; margin: 6px 0 18px; }
.share-row { display: flex; justify-content: center; }
.paras { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--hairline); }
.paras h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.paras p { color: var(--text-2); line-height: 1.5; }

/* ---------- sheet (proof card) ---------- */
.sheet {
  position: absolute; inset: 0; z-index: 5; display: grid; place-items: start center; padding-top: 52px;
  background: rgba(0,0,0,.22); animation: fade .15s ease;
}
.sheet[hidden] { display: none; }
.sheet-body { background: var(--window-bg); border-radius: 0 0 10px 10px; padding: 18px; box-shadow: var(--shadow-sm); width: 480px; }
.card {
  position: relative; border-radius: 14px; padding: 22px 24px; color: #fff; overflow: hidden;
  background: linear-gradient(135deg, #0f766e 0%, #155e75 55%, #1e3a8a 100%);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25);
}
.card .big { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
.card .line { opacity: .9; margin-top: 4px; }
.card .apps { display: flex; gap: 6px; margin: 14px 0; }
.card .apps .appicon { box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
.card .sig { font: 10px/1.5 var(--mono); opacity: .75; margin-top: 10px; word-break: break-all; }
.card .brand { position: absolute; right: 18px; top: 18px; font-size: 11px; opacity: .85; display: flex; align-items: center; gap: 6px; }
.card .brand i { width: 8px; height: 8px; border-radius: 50%; background: #34c759; display: inline-block; box-shadow: 0 0 6px #34c759; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.sheet-note { font-size: 11px; color: var(--text-3); margin-top: 10px; }

/* ---------- Studio ---------- */
.studio { display: grid; grid-template-columns: 170px 1fr; height: 100%; }
.side { border-right: 1px solid var(--hairline); padding: 12px 8px; background: var(--panel-2); }
.side button {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; text-align: left; margin-bottom: 2px;
}
.side button[aria-selected="true"] { background: var(--selected); }
.side kbd { font: 10px var(--font); color: var(--text-3); }
.side .cap { padding: 10px 10px 4px; display: block; }
.pane { padding: 16px 20px 24px; overflow: auto; min-height: 0; }
.pane h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.pane .lead { color: var(--text-2); margin-bottom: 12px; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hairline); }
.trow .sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.trow .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.adv { margin-top: 18px; padding-top: 10px; }
pre.code {
  margin: 10px 0 0; padding: 12px 14px; border-radius: 8px; overflow: auto;
  background: var(--code-bg); color: var(--code-fg); font: 11px/1.55 var(--mono); tab-size: 2;
}
pre.code .c { color: #7f8c8d; }
.boxcard { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; }
.boxcard .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 12px 0; }
.boxcard .kv dt { color: var(--text-2); } .boxcard .kv dd { margin: 0; }
.boxcard .head { display: flex; align-items: center; gap: 10px; }
.boxcard .head .state { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.boxcard .acts { display: flex; gap: 8px; }
.boxcard.idle { margin-top: 10px; display: flex; align-items: center; gap: 10px; color: var(--text-2); }
.boxcard.idle .btn { margin-left: auto; }
.logbar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.logbar .state { color: var(--text-2); font-size: 12px; }
.logbar .state.ok { color: var(--green); font-weight: 600; }
.vbar { height: 3px; border-radius: 2px; background: var(--hairline); overflow: hidden; margin-top: 10px; }
.vbar i { display: block; height: 100%; width: 0; background: var(--green); transition: width 1.2s ease; }

/* ---------- notification (prompt) ---------- */
.notif {
  position: fixed; top: 36px; right: 14px; width: 372px; z-index: 70;
  padding: 12px 14px 12px; border-radius: 16px;
  background: var(--popover-bg);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--shadow-lg);
  transform: translateX(120%); opacity: 0; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s;
}
.notif.show { transform: none; opacity: 1; }
.n-top { display: flex; gap: 11px; align-items: flex-start; }
.n-icon { width: 36px; height: 36px; border-radius: 9px; flex: none; display: grid; place-items: center;
  background: linear-gradient(135deg, #0f766e, #1e3a8a); }
.n-icon i { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
.n-text { flex: 1; min-width: 0; }
.n-title { font-weight: 600; }
.n-body { color: var(--text-2); }
.n-count { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.n-btns { display: flex; gap: 8px; margin-top: 11px; }
.n-btns .btn { flex: 1; }
.n-bar { height: 2px; border-radius: 1px; background: var(--hairline); margin-top: 10px; overflow: hidden; }
.n-bar i { display: block; height: 100%; width: 100%; background: var(--amber); transition: width 1s linear; }

/* ---------- toast ---------- */
.toast {
  position: absolute; left: 50%; bottom: 16px; transform: translate(-50%, 8px); z-index: 6;
  padding: 6px 12px; border-radius: 8px; background: rgba(30,30,32,.88); color: #fff; font-size: 12px;
  opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- prototype controls ---------- */
.proto {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 40;
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px;
  background: rgba(20,20,22,.72); color: #fff; font-size: 12px; white-space: nowrap;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.proto .tag { opacity: .6; margin-right: 4px; letter-spacing: .04em; text-transform: uppercase; font-size: 10px; font-weight: 600; }
.proto button { border: 0; border-radius: 6px; padding: 4px 10px; background: rgba(255,255,255,.16); color: #fff; font-size: 12px; }
.proto button:hover { background: rgba(255,255,255,.26); }
</style>
</head>
<body>

<div class="menubar" role="banner" aria-label="macOS menu bar (mock)">
  <div class="mb-left">
    <span class="apple" aria-hidden="true">&#63743;</span>
    <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
  </div>
  <div class="mb-right">
    <button id="statusItem" class="statusitem" data-act="toggle-popover" aria-haspopup="dialog" aria-expanded="false" aria-label="Sandbox-ai status">
      <span id="dot" class="dot green"></span>
    </button>
    <span class="mb-glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 12.5a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6zM8 9c1.3 0 2.5.5 3.4 1.4l-1.2 1.2A3 3 0 0 0 8 10.8a3 3 0 0 0-2.2.8l-1.2-1.2A4.8 4.8 0 0 1 8 9zm0-3.2c2.2 0 4.2.9 5.7 2.3l-1.2 1.2A6.3 6.3 0 0 0 8 7.6a6.3 6.3 0 0 0-4.5 1.7L2.3 8.1A8 8 0 0 1 8 5.8zM8 2.5c3.1 0 5.9 1.2 8 3.2l-1.2 1.2A9.6 9.6 0 0 0 8 4.3a9.6 9.6 0 0 0-6.8 2.6L0 5.7a11.3 11.3 0 0 1 8-3.2z"/></svg></span>
    <span class="mb-glyph" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M1 5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1h.5a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H13v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5zm2-.8a.8.8 0 0 0-.8.8v6c0 .4.4.8.8.8h8c.4 0 .8-.4.8-.8V5a.8.8 0 0 0-.8-.8H3zm.4 1.2h6.4v5.2H3.4z"/></svg></span>
    <span id="clock" class="mb-clock"></span>
  </div>
</div>

<div id="popover" class="popover" role="dialog" aria-label="Sandbox-ai glance"></div>

<div class="desktop">
  <section class="window" aria-label="Sandbox-ai window">
    <header class="titlebar">
      <div class="lights" aria-hidden="true"><span class="r"></span><span class="y"></span><span class="g"></span></div>
      <div class="wtitle">Sandbox-ai</div>

    </header>

<div class="proto" aria-label="Prototype controls">
  <span class="tag">Prototype</span>
  <button data-act="simulate">Simulate: LM Studio wants to download a model</button>
  <button data-act="theme" id="themeBtn">Theme: Auto</button>
  <button data-act="reset">Reset</button>
</div>

<script>
(function () {
  'use strict';

  /* ---------- mock data ---------- */
  var APPS = {
    ollama:   { name: 'Ollama',      bg: '#1d1d1f', ch: 'O'  },
    lmstudio: { name: 'LM Studio',   bg: '#5856d6', ch: 'LM' },
    jan:      { name: 'Jan',         bg: '#12b3a8', ch: 'J'  },
    claude:   { name: 'Claude Code', bg: '#d97757', ch: 'C'  }
  };
  var DESTS = {
    hf:        { label: 'Model download',   host: 'huggingface.co',    purpose: 'to download a model' },
    lms:       { label: 'Update check',     host: 'lmstudio.ai',       purpose: 'to check for updates' },
    sentry:    { label: 'Crash reports',    host: 'sentry.io',         purpose: 'to send a crash report' },
    anthropic: { label: 'Your AI provider', host: 'api.anthropic.com', purpose: 'to talk to your AI provider' }
  };
  var YAML_IDS = { ollama: 'ollama', lmstudio: 'lmstudio', jan: 'jan', claude: 'claude-code' };

  var NOW = Date.now(), MIN = 60e3, HOUR = 3600e3, DAY = 86400e3;
  function at(daysAgo, h, m) { var d = new Date(NOW - daysAgo * DAY); d.setHours(h, m, 0, 0); return d.getTime(); }

  var seq = 0;
  function mk(app, dest, verb, t, bytes, extra) {
    var e = { id: 'e' + (++seq), app: app, dest: dest, verb: verb, t: t, bytes: bytes || 0, size: 0, always: false, note: '', prev: null };
    for (var k in extra) e[k] = extra[k];
    return e;
  }

  var state;
  function freshState() {
    seq = 0;
    return {
      mode: 'private',            // private | watch | off
      surface: 'feed',
      studioTab: 'trusted',
      filter: 'all',
      expanded: null,
      sheet: false,
      advanced: false,
      verify: 'idle',             // idle | running | ok
      blockedAt: 0,
      pending: null,              // { id, remaining, timer }
      watchSeen: [],
      trusted: [
        { app: 'claude',   dest: 'anthropic', on: true  },
        { app: 'lmstudio', dest: 'hf',        on: false },
        { app: 'lmstudio', dest: 'lms',       on: false },
        { app: 'lmstudio', dest: 'sentry',    on: false },
        { app: 'jan',      dest: 'hf',        on: false },
        { app: 'jan',      dest: 'anthropic', on: false },
        { app: 'ollama',   dest: 'hf',        on: false }
      ],
      events: [
        mk('lmstudio', 'lms',       'Blocked', NOW - 12 * MIN,  0,     { size: 4096 }),
        mk('lmstudio', 'sentry',    'Blocked', NOW - 41 * MIN,  0,     { size: 18e3 }),
        mk('jan',      'hf',        'Blocked', NOW - 2 * HOUR,  0,     { size: 2.1e9, note: 'No answer in 30 seconds, so it was blocked.' }),
        mk('claude',   'anthropic', 'Allowed', at(1, 18, 2),    48e3,  { size: 48e3, always: true }),
        mk('ollama',   'hf',        'Blocked', at(1, 17, 40),   0,     { size: 4.7e9 }),
        mk('jan',      'anthropic', 'Blocked', at(3, 10, 15),   0,     { size: 12e3, note: 'Jan offered a cloud model. Blocked so local stays local.' })
      ]
    };
  }

  /* ---------- helpers ---------- */
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmtBytes(n) {
    if (!n) return '0 bytes';
    if (n < 1024) return n + ' bytes';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return (n >= 10 || n === Math.round(n) ? Math.round(n) : n.toFixed(1)) + ' ' + u[i];
  }
  function fmtClock(t) { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function fmtTime(t) {
    var d = new Date(t), n = new Date(), day = function (x) { return Math.floor((x.getTime() - x.getTimezoneOffset() * MIN) / DAY); };
    var diff = day(n) - day(d);
    if (diff === 0) return fmtClock(t);
    if (diff === 1) return 'Yesterday ' + fmtClock(t);
    return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + fmtClock(t);
  }
  function isToday(t) { return fmtTime(t) === fmtClock(t); }
  function destLabel(d) { return DESTS[d].label + ' (' + DESTS[d].host + ')'; }
  function icon(app, lg) { var a = APPS[app]; return '<span class="appicon' + (lg ? ' lg' : '') + '" style="background:' + a.bg + '" aria-hidden="true">' + a.ch + '</span>'; }
  function byId(id) { for (var i = 0; i < state.events.length; i++) if (state.events[i].id === id) return state.events[i]; return null; }
  function trustedFor(app, dest) { for (var i = 0; i < state.trusted.length; i++) { var t = state.trusted[i]; if (t.app === app && t.dest === dest) return t; } return null; }
  function hash(s, len) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; } var out = ''; while (out.length < len) { out += h.toString(16); h = (h * 2654435761) >>> 0; } return out.slice(0, len); }
  function bytesToday() { return state.events.reduce(function (s, e) { return s + (e.verb === 'Allowed' && isToday(e.t) ? e.bytes : 0); }, 0); }
  function sorted() { return state.events.slice().sort(function (a, b) { return b.t - a.t; }); }

  function explain(e) {
    var app = APPS[e.app].name, d = DESTS[e.dest], s;
    if (e.verb === 'Asked') s = app + ' wants to reach ' + d.host + ' ' + d.purpose + '. Waiting for your answer.';
    else if (e.verb === 'Allowed') s = app + ' sent ' + fmtBytes(e.bytes) + ' to ' + d.host + ' ' + d.purpose + '. ' + (e.always ? 'This destination is trusted for ' + app + ', so it was allowed.' : 'You allowed it once.');
    else if (e.verb === 'Seen') s = app + ' sent ' + fmtBytes(e.bytes) + ' to ' + d.host + ' ' + d.purpose + '. Watch mode recorded it and let it through.';
    else s = app + ' wanted to reach ' + d.host + ' ' + d.purpose + '. Blocked, so nothing left your Mac.';
    return s + (e.note ? ' ' + e.note : '');
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- status (Glance) ---------- */
  function dotClass() {
    if (state.mode === 'off') return 'gray';
    if (state.mode === 'watch') return 'blue';
    if (state.pending) return 'amber';
    if (Date.now() - state.blockedAt < 60e3) return 'red';
    return 'green';
  }
  function sentence() {
    if (state.mode === 'off') return 'Off. Your AI apps can reach anything.';
    if (state.mode === 'watch') return 'Watching. ' + state.watchSeen.length + ' destination' + (state.watchSeen.length === 1 ? '' : 's') + ' seen.';
    return 'Private. ' + fmtBytes(bytesToday()) + ' left today.';
  }
  function renderStatus() {
    var dot = $('#dot'); dot.className = 'dot ' + dotClass();
    $('#statusItem').setAttribute('aria-label', 'Sandbox-ai: ' + sentence());
    var gd = $('#gdot'); if (gd) gd.className = 'dot ' + dotClass();
    var gs = $('#gsentence'); if (gs) gs.textContent = sentence();
  }
  function renderPopover() {
    var p = $('#popover'), recent = sorted().slice(0, 3), isWatch = state.mode === 'watch', isPrivate = state.mode === 'private';
    var h = '<div class="g-status"><span id="gdot" class="dot ' + dotClass() + '"></span><span id="gsentence">' + esc(sentence()) + '</span></div>';
    h += '<div class="g-row"><span class="lbl">Private mode</span><label class="switch"><input type="checkbox" data-change="private"' + (isPrivate ? ' checked' : '') + ' aria-label="Private mode"><span class="track"></span></label></div>';
    h += '<div class="g-row"><span><div class="lbl">Watch mode</div><div class="sub">Allow everything for an hour and just record.</div></span><label class="switch sm"><input type="checkbox" data-change="watch"' + (isWatch ? ' checked' : '') + ' aria-label="Watch mode"><span class="track"></span></label></div>';
    if (isWatch) h += '<div class="g-cta"><button class="btn primary" data-act="make-private">Make it private?</button></div>';
    h += '<div class="g-sep"></div><div class="g-head">RECENT</div>';
    if (!recent.length) h += '<div class="g-empty">Nothing yet.</div>';
    recent.forEach(function (e) {
      h += '<div class="g-ev"><span class="verb ' + e.verb + '">' + e.verb + '</span><span class="what">' + esc(APPS[e.app].name) + ' · ' + esc(DESTS[e.dest].label) + '</span><span class="time">' + esc(fmtTime(e.t)) + '</span></div>';
    });
    h += '<div class="g-sep"></div><div class="g-foot"><button class="btn" data-act="surface" data-v="feed">Feed</button><button class="btn" data-act="surface" data-v="proof">Proof</button>' +
      '<button class="btn gear" data-act="surface" data-v="studio" aria-label="Studio" title="Studio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>';
    p.innerHTML = h;
  }
  function openPopover(open) {
    var p = $('#popover'), b = $('#statusItem');
    if (open) {
      renderPopover();
      var r = b.getBoundingClientRect(), left = Math.min(r.left + r.width / 2 - 160, window.innerWidth - 332);
      p.style.left = left + 'px';
      p.style.setProperty('--arrow-x', (r.left + r.width / 2 - left) + 'px');
      p.classList.add('open'); b.setAttribute('aria-expanded', 'true');
      var first = p.querySelector('input, button'); if (first) first.focus();
    } else {
      p.classList.remove('open'); b.setAttribute('aria-expanded', 'false');
    }
  }
  function popoverOpen() { return $('#popover').classList.contains('open'); }

  /* ---------- window ---------- */
  function render() {
    renderStatus();
    document.querySelectorAll('.seg [role=tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.v === state.surface)); });
    var c = $('#content');
    c.classList.toggle('flush', state.surface === 'studio');
    c.innerHTML = state.surface === 'feed' ? renderFeed() : state.surface === 'proof' ? renderProof() : renderStudio();
    var sh = $('#sheet'); sh.hidden = !state.sheet; if (state.sheet) sh.innerHTML = renderSheet();
    if (popoverOpen()) renderPopover();
  }

  /* ---------- Feed ---------- */
  function renderFeed() {
    var chips = [['all', 'All'], ['today', 'Today'], ['blocked', 'Blocked']];
    Object.keys(APPS).forEach(function (k) { chips.push([k, APPS[k].name]); });
    var h = '<div class="chips" role="group" aria-label="Filters">' + chips.map(function (c) {
      return '<button class="chip' + (state.filter === c[0] ? ' active' : '') + '" data-act="filter" data-v="' + c[0] + '" aria-pressed="' + (state.filter === c[0]) + '">' + esc(c[1]) + '</button>';
    }).join('') + '</div>';
    var list = sorted().filter(function (e) {
      if (state.filter === 'today') return isToday(e.t);
      if (state.filter === 'blocked') return e.verb === 'Blocked';
      if (APPS[state.filter]) return e.app === state.filter;
      return true;
    });
    if (!list.length) return h + '<div class="empty">Nothing here. That is the point.</div>';
    var groups = [], seen = {};
    list.forEach(function (e) { if (!seen[e.app]) { seen[e.app] = { app: e.app, items: [] }; groups.push(seen[e.app]); } seen[e.app].items.push(e); });
    groups.forEach(function (g) {
      h += '<div class="group"><div class="group-h">' + icon(g.app) + esc(APPS[g.app].name) + '</div>';
      g.items.forEach(function (e) {
        var open = state.expanded === e.id;
        h += '<button class="event" data-act="expand" data-v="' + e.id + '" aria-expanded="' + open + '">' +
          '<span class="verb ' + e.verb + '">' + e.verb + '</span><span class="dest">' + esc(destLabel(e.dest)) + '</span>' +
          '<span class="bytes">' + (e.verb === 'Allowed' || e.verb === 'Seen' ? esc(fmtBytes(e.bytes)) : '') + '</span>' +
          '<span class="time">' + esc(fmtTime(e.t)) + '</span></button>';
        if (open) {
          h += '<div class="expand"><div>' + esc(explain(e)) + '</div><div class="actions">' +
            '<button class="btn sm" data-act="decide" data-v="' + e.id + '" data-d="allow">Allow once</button>' +
            '<button class="btn sm" data-act="decide" data-v="' + e.id + '" data-d="always">Always allow</button>' +
            '<button class="btn sm" data-act="decide" data-v="' + e.id + '" data-d="block">Block</button>' +
            (e.prev ? '<button class="undo" data-act="undo" data-v="' + e.id + '">Undo</button>' : '') +
            '</div></div>';
        }
      });
      h += '</div>';
    });
    return h;
  }

  /* ---------- Proof ---------- */
  var STREAK_DAYS = 14;
  function sinceText() {
    var d = new Date(NOW - STREAK_DAYS * DAY);
    return d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }
  function renderProof() {
    var b = bytesToday(), apps = Object.keys(APPS);
    return '<div class="hero"><div class="streak">Private for ' + STREAK_DAYS + ' days</div>' +
      '<div class="since">Since ' + esc(sinceText()) + ', nothing has left your Mac without your say-so.</div></div>' +
      '<div class="proof-apps" aria-label="Apps protected">' + apps.map(function (a) { return icon(a, true); }).join('') + '</div>' +
      '<div class="stats"><div class="stat"><div class="num">' + esc(fmtBytes(b)) + '</div><div class="lbl">left today' + (b ? ', allowed by you' : '') + '</div></div>' +
      '<div class="stat"><div class="num">' + apps.length + '</div><div class="lbl">apps protected</div></div>' +
      '<div class="stat"><div class="num">' + state.events.filter(function (e) { return e.verb === 'Blocked'; }).length + '</div><div class="lbl">attempts blocked</div></div></div>' +
      '<div class="share-row"><button class="btn primary" data-act="share">Share proof</button></div>' +
      '<div class="paras"><div><h3>What this proof covers</h3><p>Every connection that Ollama, LM Studio, Jan and Claude Code tried to open from this Mac since ' + esc(sinceText().split(',')[0]) + '. Each one was allowed or blocked, written down, and signed by this Mac so it cannot be edited later. The card you share carries that signature.</p></div>' +
      '<div><h3>What it cannot see</h3><p>Anything that left through an app we do not protect, a browser, or another computer. Data already sent before Private mode was on. The contents of allowed connections: we count the bytes, we do not read them.</p></div></div>';
  }
  function renderSheet() {
    var from = new Date(NOW - STREAK_DAYS * DAY).toLocaleDateString([], { month: 'short', day: 'numeric' });
    var to = new Date(NOW).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    return '<div class="sheet-body" role="dialog" aria-label="Proof card">' +
      '<div class="card"><div class="brand"><i></i>Protected by Sandbox-ai</div>' +
      '<div class="big">Private for ' + STREAK_DAYS + ' days</div><div class="line">' + esc(from) + ' – ' + esc(to) + ' · ' + esc(fmtBytes(bytesToday())) + ' left today · 4 apps protected</div>' +
      '<div class="apps">' + Object.keys(APPS).map(function (a) { return icon(a); }).join('') + '</div>' +
      '<div class="sig">signed ed25519 · ' + hash('proof' + NOW, 16) + '…' + hash('tail' + NOW, 8) + '<br>receipts 1,284 · chain intact · verify with the attached .proof file</div></div>' +
      '<div class="sheet-note">The image is for people. The file is for anyone who wants to check it.</div>' +
      '<div class="sheet-actions"><button class="btn" data-act="save-mock" data-v="image">Save image</button><button class="btn" data-act="save-mock" data-v="file">Save proof file</button><button class="btn primary" data-act="close-sheet">Done</button></div></div>';
  }

  /* ---------- Studio ---------- */
  function renderStudio() {
    var tabs = [['trusted', 'Trusted'], ['box', 'Box'], ['logs', 'Logs']];
    var h = '<div class="studio"><nav class="side" aria-label="Studio sections"><span class="cap">STUDIO</span>' + tabs.map(function (t, i) {
      return '<button role="tab" data-act="studio-tab" data-v="' + t[0] + '" aria-selected="' + (state.studioTab === t[0]) + '">' + t[1] + '<kbd>' + (i + 1) + '</kbd></button>';
    }).join('') + '</nav><div class="pane">';
    h += state.studioTab === 'trusted' ? renderTrusted() : state.studioTab === 'box' ? renderBox() : renderLogs();
    return h + '</div></div>';
  }
  function renderTrusted() {
    var h = '<h2>Trusted destinations</h2><p class="lead">Each switch lets one app reach one place. Everything else stays blocked.</p>';
    state.trusted.forEach(function (t, i) {
      h += '<div class="trow"><div class="who">' + icon(t.app) + '<div><div>' + esc(destLabel(t.dest)) + '</div><div class="sub">' + esc(APPS[t.app].name) + ', ' + esc(DESTS[t.dest].purpose) + '</div></div></div>' +
        '<label class="switch"><input type="checkbox" data-change="trusted" data-v="' + i + '"' + (t.on ? ' checked' : '') + ' aria-label="' + esc(APPS[t.app].name + ': ' + destLabel(t.dest)) + '"><span class="track"></span></label></div>';
    });
    h += '<div class="trow adv"><div><div>Advanced</div><div class="sub">Show the raw file behind these switches.</div></div><label class="switch sm"><input type="checkbox" data-change="advanced"' + (state.advanced ? ' checked' : '') + ' aria-label="Advanced"><span class="track"></span></label></div>';
    if (state.advanced) h += '<pre class="code" aria-label="Raw policy file">' + renderYaml() + '</pre>';
    return h;
  }
  function renderYaml() {
    var c = function (s) { return '<span class="c"># ' + esc(s) + '</span>'; };
    var out = c('~/Library/Application Support/Sandbox-ai/policy.yaml') + '\nversion: 1\nmode: ' + (state.mode === 'watch' ? 'watch' : 'strict') + '            ' + c('strict | ask | watch') + '\ndefault: deny\n\napps:\n';
    Object.keys(APPS).forEach(function (a) {
      out += '  ' + YAML_IDS[a] + ':\n';
      if (a === 'claude') out += '    sandbox: box          ' + c('vsock to the host proxy, no NIC') + '\n';
      out += '    egress:\n      allowlist:\n';
      var any = false;
      state.trusted.forEach(function (t) {
        if (t.app !== a || !t.on) return; any = true;
        out += '        - host: ' + DESTS[t.dest].host + '\n          ports: [443]\n          tls: passthrough    ' + c(DESTS[t.dest].label.toLowerCase()) + '\n';
      });
      if (!any) out += '        []                ' + c('nothing trusted yet') + '\n';
      out += '      unknown: deny\n';
    });
    return out + '\nlog:\n  sign: ed25519\n  keep: local-only\n';
  }
  function renderBox() {
    return '<h2>Box</h2><p class="lead">Agents run inside a Box: their own small computer with no direct way out.</p>' +
      '<div class="boxcard"><div class="head">' + icon('claude', true) + '<div><div><b>Claude Code</b></div><div class="cap">~/code/sandbox-ai</div></div><div class="state"><span class="dot green"></span>Running · 29 min</div></div>' +
      '<dl class="kv"><dt>Connections</dt><dd>2 · Your AI provider (api.anthropic.com), Package downloads (registry.npmjs.org)</dd>' +
      '<dt>Memory</dt><dd>1.1 GB of 4 GB, given back when idle</dd><dt>Can see</dt><dd>Only this project folder. No keys, no home folder.</dd>' +
      '<dt>Snapshots</dt><dd>1 · taken before this run, ' + esc(fmtClock(NOW - 29 * MIN)) + '</dd></dl>' +
      '<div class="acts"><button class="btn" data-act="box" data-v="snapshot">Snapshot</button><button class="btn" data-act="box" data-v="rollback">Roll back</button><button class="btn" data-act="box" data-v="stop">Stop</button></div></div>' +
      '<div class="boxcard idle"><span class="dot gray"></span>Codex CLI · not running<button class="btn sm" data-act="box" data-v="run">Run in Box</button></div>';
  }
  function renderLogs() {
    var lines = state.events.slice().sort(function (a, b) { return a.t - b.t; }).slice(-5), prev = hash('genesis', 12), base = 1279;
    var h = '<h2>Logs</h2><p class="lead">Every decision becomes a signed receipt, chained to the one before it. Nothing leaves this Mac unless you export it.</p><pre class="code" aria-label="Receipts">';
    lines.forEach(function (e, i) {
      var r = { seq: base + i, ts: new Date(e.t).toISOString().replace(/\.\d+Z$/, 'Z'), app: YAML_IDS[e.app], dest: DESTS[e.dest].host + ':443',
        decision: e.verb === 'Allowed' || e.verb === 'Seen' ? 'allow' : e.verb === 'Asked' ? 'ask' : 'deny', bytes: e.bytes,
        rule: e.verb === 'Allowed' && e.always ? 'trusted:' + YAML_IDS[e.app] + '/' + e.dest : e.verb === 'Allowed' ? 'user:allow-once' : state.mode === 'watch' && e.verb === 'Seen' ? 'mode:watch' : 'default:deny',
        prev: prev, sig: 'ed25519:' + hash(e.id + e.verb + e.t, 20) + '…' };
      prev = hash(JSON.stringify(r), 12);
      h += esc(JSON.stringify(r)) + '\n';
    });
    h += '</pre><div class="logbar"><button class="btn" data-act="verify"' + (state.verify === 'running' ? ' disabled' : '') + '>' + (state.verify === 'running' ? 'Verifying…' : 'Verify') + '</button><button class="btn" data-act="export-mock">Export</button>' +
      '<span class="state' + (state.verify === 'ok' ? ' ok' : '') + '" role="status">' + (state.verify === 'ok' ? 'Chain intact · 1,284 receipts · signed by this Mac' : state.verify === 'running' ? 'Checking 1,284 receipts…' : '') + '</span></div>' +
      '<div class="vbar"><i id="vfill" style="width:' + (state.verify === 'ok' ? '100%' : '0') + '"></i></div>';
    return h;
  }

  /* ---------- prompt (notification) ---------- */
  function renderNotif() {
    var n = $('#notif'), p = state.pending;
    if (!p) { n.classList.remove('show'); n.setAttribute('aria-hidden', 'true'); return; }
    var e = byId(p.id), app = APPS[e.app].name, d = DESTS[e.dest];
    if (!n.classList.contains('show')) {
      n.innerHTML = '<div class="n-top"><div class="n-icon" aria-hidden="true"><i></i></div><div class="n-text">' +
        '<div class="n-title">' + esc(app) + ' wants ' + esc(d.purpose) + '</div>' +
        '<div class="n-body">' + esc(fmtBytes(e.size)) + ' to ' + esc(d.host) + '. Allow?</div></div><div class="n-count" id="ncount"></div></div>' +
        '<div class="n-btns"><button class="btn" data-act="decide" data-v="' + e.id + '" data-d="allow">Allow once</button>' +
        '<button class="btn" data-act="decide" data-v="' + e.id + '" data-d="always">Always allow</button>' +
        '<button class="btn primary" data-act="decide" data-v="' + e.id + '" data-d="block">Block</button></div>' +
        '<div class="n-bar"><i id="nfill"></i></div>';
      n.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(function () { n.classList.add('show'); });
    }
    var c = $('#ncount'); c.textContent = p.remaining + ' s'; c.setAttribute('aria-label', 'Blocks in ' + p.remaining + ' seconds'); c.title = 'Blocked automatically in ' + p.remaining + ' s';
    var f = $('#nfill'); if (f) f.style.width = (p.remaining / 30 * 100) + '%';
  }

  function simulate() {
    if (state.pending) { toast('Already asking. Answer the notification first.'); return; }
    var app = 'lmstudio', dest = 'hf', size = 1.2 * 1024 * 1024 * 1024, t = trustedFor(app, dest);
    if (state.mode === 'off') {
      state.events.push(mk(app, dest, 'Allowed', Date.now(), size, { size: size, note: 'Private mode was off, so nothing was asked.' }));
      toast('Allowed. Private mode is off.');
    } else if (state.mode === 'watch') {
      state.events.push(mk(app, dest, 'Seen', Date.now(), size, { size: size }));
      if (state.watchSeen.indexOf(app + ':' + dest) < 0) state.watchSeen.push(app + ':' + dest);
      toast('Seen. Watch mode records, it does not block.');
    } else if (t && t.on) {
      state.events.push(mk(app, dest, 'Allowed', Date.now(), size, { size: size, always: true }));
      toast('Allowed. huggingface.co is trusted for LM Studio.');
    } else {
      var e = mk(app, dest, 'Asked', Date.now(), 0, { size: size });
      state.events.push(e);
      state.pending = { id: e.id, remaining: 30, timer: setInterval(tick, 1000) };
      renderNotif();
    }
    render();
  }
  function tick() {
    var p = state.pending; if (!p) return;
    p.remaining--;
    if (p.remaining <= 0) decide(p.id, 'timeout'); else renderNotif();
  }
  function clearPending(id) {
    if (state.pending && state.pending.id === id) { clearInterval(state.pending.timer); state.pending = null; renderNotif(); }
  }

  function snapshot(e) { var t = trustedFor(e.app, e.dest); return { verb: e.verb, bytes: e.bytes, always: e.always, note: e.note, trusted: t ? t.on : null }; }
  function decide(id, d) {
    var e = byId(id); if (!e) return;
    var t = trustedFor(e.app, e.dest), wasPending = state.pending && state.pending.id === id;
    e.prev = snapshot(e);
    e.note = '';
    if (d === 'allow') { e.verb = 'Allowed'; e.bytes = e.size; e.always = false; toast('Allowed once. Undo in Feed.'); }
    else if (d === 'always') { e.verb = 'Allowed'; e.bytes = e.size; e.always = true; if (t) t.on = true; toast(DESTS[e.dest].host + ' is now trusted for ' + APPS[e.app].name + '.'); }
    else {
      e.verb = 'Blocked'; e.bytes = 0; e.always = false; if (t && d !== 'timeout') t.on = false;
      if (d === 'timeout') e.note = 'No answer in 30 seconds, so it was blocked.';
      state.blockedAt = Date.now();
      toast(d === 'timeout' ? 'No answer, so it was blocked. Undo in Feed.' : 'Blocked. Undo in Feed.');
    }
    if (wasPending) { e.t = Date.now(); clearPending(id); }
    state.expanded = id;
    if (state.surface !== 'feed' && wasPending) state.filter = 'all';
    render();
  }
  function undo(id) {
    var e = byId(id); if (!e || !e.prev) return;
    var p = e.prev, t = trustedFor(e.app, e.dest);
    e.verb = p.verb === 'Asked' ? 'Blocked' : p.verb; e.bytes = p.bytes; e.always = p.always; e.note = p.verb === 'Asked' ? 'Undone, so it stays blocked.' : p.note;
    if (t && p.trusted !== null) t.on = p.trusted;
    e.prev = null;
    toast('Undone.');
    render();
  }

  /* ---------- modes ---------- */
  function setMode(m) {
    state.mode = m;
    if (m === 'watch' && !state.watchSeen.length) state.watchSeen = ['lmstudio:lms', 'lmstudio:sentry', 'jan:hf'];
    if (m !== 'watch') state.watchSeen = [];
    render();
  }

  /* ---------- theme ---------- */
  var themes = ['auto', 'light', 'dark'], themeIdx = 0;
  function applyTheme() {
    var t = themes[themeIdx];
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    $('#themeBtn').textContent = 'Theme: ' + t.charAt(0).toUpperCase() + t.slice(1);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) {
      if (popoverOpen() && !ev.target.closest('#popover')) openPopover(false);
      return;
    }
    var act = b.dataset.act, v = b.dataset.v;
    switch (act) {
      case 'toggle-popover': openPopover(!popoverOpen()); break;
      case 'surface': state.surface = v; state.sheet = false; openPopover(false); render(); break;
      case 'make-private': setMode('private'); openPopover(false); toast('Private mode is on. Trust what you saw from Studio any time.'); break;
      case 'filter': state.filter = v; render(); break;
      case 'expand': state.expanded = state.expanded === v ? null : v; render(); break;
      case 'decide': decide(v, b.dataset.d); break;
      case 'undo': undo(v); break;
      case 'share': state.sheet = true; render(); var done = $('#sheet .primary'); if (done) done.focus(); break;
      case 'close-sheet': state.sheet = false; render(); break;
      case 'save-mock': toast(v === 'image' ? 'Saved proof.png to Downloads (mock).' : 'Saved proof.json to Downloads (mock).'); break;
      case 'studio-tab': state.studioTab = v; render(); break;
      case 'box': toast({ snapshot: 'Snapshot taken (mock).', rollback: 'Rolled back to the snapshot from before this run (mock).', stop: 'Claude Code stopped (mock).', run: 'Codex CLI started in a Box (mock).' }[v]); break;
      case 'verify':
        state.verify = 'running'; render();
        requestAnimationFrame(function () { var f = $('#vfill'); if (f) f.style.width = '100%'; });
        setTimeout(function () { state.verify = 'ok'; render(); }, 1300);
        break;
      case 'export-mock': toast('Exported receipts.jsonl with the public key (mock).'); break;
      case 'simulate': simulate(); break;
      case 'theme': themeIdx = (themeIdx + 1) % themes.length; applyTheme(); break;
      case 'reset': clearPending(state.pending && state.pending.id); state = freshState(); openPopover(false); render(); toast('Demo reset.'); break;
    }
  });

  document.addEventListener('change', function (ev) {
    var i = ev.target.closest('[data-change]'); if (!i) return;
    switch (i.dataset.change) {
      case 'private': setMode(i.checked ? 'private' : 'off'); break;
      case 'watch': setMode(i.checked ? 'watch' : 'private'); break;
      case 'trusted': state.trusted[+i.dataset.v].on = i.checked; toast(i.checked ? 'Trusted.' : 'Blocked again.'); if (state.advanced) render(); break;
      case 'advanced': state.advanced = i.checked; render(); break;
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (state.sheet) { state.sheet = false; render(); }
      else if (popoverOpen()) { openPopover(false); $('#statusItem').focus(); }
      return;
    }
    if ((ev.metaKey || ev.ctrlKey) && !ev.shiftKey && ['1', '2', '3'].indexOf(ev.key) >= 0) {
      ev.preventDefault();
      state.surface = ['feed', 'proof', 'studio'][+ev.key - 1]; state.sheet = false; render();
    } else if (state.surface === 'studio' && !ev.metaKey && !ev.ctrlKey && ['1', '2', '3'].indexOf(ev.key) >= 0 && !/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) {
      state.studioTab = ['trusted', 'box', 'logs'][+ev.key - 1]; render();
    }
  });

  /* ---------- boot ---------- */
  function clock() {
    var d = new Date();
    $('#clock').textContent = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + '  ' + fmtClock(d);
  }
  state = freshState();
  applyTheme();
  clock(); setInterval(clock, 10000);
  setInterval(renderStatus, 1000);
  render();
})();
</script>
</body>
</html>
