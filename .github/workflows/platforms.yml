# Builds and tests the core and the command line tool on Linux and Windows.
#
# This Mac cannot run either system, so GitHub's machines are the test bed for them. Runs only on
# the `platforms` work branch and by hand; the macOS tests live in test.yml.

name: Linux and Windows

on:
  push:
    branches: [platforms]
    paths: ["app/**", ".github/workflows/platforms.yml"]
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Core compiles
        run: cargo build -p homebody-core --tests 2>&1 | tail -150
      - name: Command line tool compiles
        if: always()
        run: cargo build -p homebody-cli 2>&1 | tail -80
      - name: Core unit tests
        if: always()
        run: cargo test -p homebody-core 2>&1 | tail -120

      # Linux only from here: the gate against the bypass corpus, then the fence itself, set up
      # for real on this throwaway machine and attacked from inside.
      - name: Start the engine (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: |
          (./target/debug/homebody daemon > /tmp/homebody-daemon.log 2>&1 &)
          sleep 4
          ./target/debug/homebody status
      - name: Bypass corpus, gate half (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: SAI=$PWD/target/debug/homebody bash tests/bypass-corpus.sh gate
      - name: Fence, end to end (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: bash tests/linux-fence.sh --remove
      - name: Fleet server tests (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: cargo test -p homebody-fleet 2>&1 | tail -25
      - name: The engine builds to the same file twice (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: bash scripts/repro-check.sh 2>&1 | tail -4
      # The action other people's pipelines would use, on a machine where Homebody was just
      # removed again: set up from nothing, then one protected run with a report.
      - name: The pipeline action, from nothing (Linux)
        if: runner.os == 'Linux' && !cancelled()
        uses: ./ci/action
        with:
          add: "Pipeline probe=/usr/bin/curl"
      - name: A protected run in a pipeline (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: |
          pkill -TERM -f 'target/debug/homebody daemon' || true
          sleep 1
          homebody ci --trust example.com --report "$RUNNER_TEMP/hb-report" --fail-on-blocked my-pipeline-probe -- /usr/bin/curl -sS -m 20 -o /dev/null https://example.com/
          homebody verify "$RUNNER_TEMP/hb-report"
          ls "$RUNNER_TEMP/hb-report" "$RUNNER_TEMP/hb-report/policy"
          set +e
          homebody ci --fail-on-blocked my-pipeline-probe -- /bin/sh -c 'curl -sS -m 20 -o /dev/null https://example.org/; true'
          [ $? -eq 3 ] && echo "a refusal fails the job, as asked"
      - name: What the engine said (Linux)
        if: runner.os == 'Linux' && always()
        run: tail -40 /tmp/homebody-daemon.log || true; cat ~/.local/share/Homebody/logs/* 2>/dev/null | tail -40 || true; sudo journalctl -k -n 15 --no-pager | grep homebody || true

      # Windows only: the fence (app containers), with a real engine, attacked from inside.
      - name: Fence, end to end (Windows)
        if: runner.os == 'Windows' && !cancelled()
        run: bash tests/windows-fence.sh
      - name: What the engine said (Windows)
        if: runner.os == 'Windows' && always()
        run: tail -40 "$TEMP/homebody-daemon.log" || true
