<!doctype html>
<html lang="en" data-window="main">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sandbox-ai</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<!-- The first 78px stay empty: the real traffic lights sit there. -->
<header class="toolbar" data-tauri-drag-region>
  <div class="tb-side" data-tauri-drag-region>
    <span class="tb-title" data-tauri-drag-region>Sandbox-ai</span>
  </div>
  <nav class="seg" id="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tabbtn-feed" data-tab="feed" aria-controls="tab-feed" aria-selected="true" title="Feed (⌘1)">Feed</button>
    <button role="tab" id="tabbtn-proof" data-tab="proof" aria-controls="tab-proof" aria-selected="false" title="Proof (⌘2)">Proof</button>
    <button role="tab" id="tabbtn-studio" data-tab="studio" aria-controls="tab-studio" aria-selected="false" title="Studio (⌘3)">Studio</button>
  </nav>
  <div class="tb-side tb-right" data-tauri-drag-region>
    <span id="pill" class="pill" role="status" data-tauri-drag-region></span>
  </div>
</header>
<div id="banner"></div>
<main class="content">
  <section id="setup" class="setup scroll" aria-label="Setup" hidden></section>
  <section id="tab-feed" class="panel" role="tabpanel" aria-labelledby="tabbtn-feed"></section>
  <section id="tab-proof" class="panel" role="tabpanel" aria-labelledby="tabbtn-proof" hidden></section>
  <section id="tab-studio" class="panel" role="tabpanel" aria-labelledby="tabbtn-studio" hidden></section>
</main>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
