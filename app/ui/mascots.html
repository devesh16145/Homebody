<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Homebody Mascot</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/identity.css">
<style>
  /* Review board only. Not part of the app. */
  html, body { height: auto; }
  body { display: block; overflow: auto; background: var(--ground); background-image: var(--ground-wash); color: var(--ink); }
  .bd { max-width: 1080px; margin: 0 auto; padding: 32px max(20px, 4vw) 72px; display: grid; gap: 22px; }
  h1 { font: 700 28px/1.1 var(--font-round); letter-spacing: -.02em; }
  .bd > p { color: var(--ink-2); margin-top: -12px; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .opt { display: grid; gap: 16px; align-content: start; padding: 22px; border-radius: 24px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .opt h2 { font: 650 19px/1.2 var(--font-round); }
  .opt p { color: var(--ink-2); font-size: var(--fs-small); }
  .row { display: flex; align-items: end; gap: 16px; }
  .icon svg { display: block; filter: drop-shadow(0 8px 18px rgba(8, 60, 70, .25)); }
  .bar { display: flex; align-items: center; justify-content: space-around; height: 30px; border-radius: 10px; color: var(--ink); }
  .bar svg { width: 27px; height: 18px; }
  .dark { background: #1d2329; color: #fff; border-radius: 10px; }
  .pick { padding: 3px 9px; border-radius: 999px; background: var(--tide); color: var(--on-tide); font: 600 11px/1.4 var(--font); }
  @media (max-width: 820px) { .opts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="bd">
  <h1>Homebody, without the robot</h1>
  <p>Same idea, peeking over the windowsill, with an outline that is nobody else’s. In the menu bar: home, asking, and ducked down when everything is blocked.</p>
  <div class="opts" id="opts"></div>
</main>
<script type="module">
  import { initPage } from './js/util.js';
  initPage();

  // Every mascot peeks over the same windowsill (y 40) in a 64 box, y down.
  // parts(state) gives: fill (solid), cut (holes: background shows through; dark on the Dock icon),
  // top (solid shapes drawn inside the holes, like pupils), paws (resting on the sill).
  // "shut" (everything blocked) ducks the animal 15 units down, so only its top shows.
  const spikes = (() => {
    let d = '';
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI - (i / 12) * Math.PI, r = i % 2 ? 15.5 : 21.5;
      d += `${i ? 'L' : 'M'}${(32 + r * Math.cos(a)).toFixed(1)} ${(42 - r * Math.sin(a)).toFixed(1)}`;
    }
    return `<path d="${d}Z" stroke-linejoin="round" stroke-width="2.4" stroke="currentColor"/>`;
  })();

  const M = {
    cat: {
      name: 'Cat', line: 'The original homebody. Ears up, paws on the sill.',
      parts: (look) => ({
        fill: '<path d="M13 42A19 19 0 0 1 51 42Z"/><path d="M15.5 33.5L17.5 13.5Q18 11 20 12.5L31 23.5Z"/><path d="M48.5 33.5L46.5 13.5Q46 11 44 12.5L33 23.5Z"/>',
        cut: `<ellipse cx="${25 + look[0]}" cy="${32 + look[1]}" rx="2.6" ry="3.7"/><ellipse cx="${39 + look[0]}" cy="${32 + look[1]}" rx="2.6" ry="3.7"/>`,
        paws: [[18, 41], [46, 41]],
      }),
    },
    raccoon: {
      name: 'Raccoon', line: 'Wears a mask: anonymous by nature. Pointed ears, the mask, paws on the sill.',
      parts: (look) => ({
        fill: '<path d="M14.5 27L14.8 16.5Q15.2 13.5 18 14.6L27 20Z"/><path d="M49.5 27L49.2 16.5Q48.8 13.5 46 14.6L37 20Z"/><path d="M13.5 42Q13 23 32 21.5Q51 23 50.5 42Z"/>',
        cut: '<path d="M13.6 30Q22 25.5 32 30.5Q42 25.5 50.4 30Q51 37.5 42.5 37.6Q36.5 37.8 32 33.6Q27.5 37.8 21.5 37.6Q13 37.5 13.6 30Z"/><path d="M17.2 22.5L17.6 18.6L22 21Z"/><path d="M46.8 22.5L46.4 18.6L42 21Z"/>',
        top: `<circle cx="${22.8 + look[0]}" cy="${32 + look[1]}" r="2.5"/><circle cx="${41.2 + look[0]}" cy="${32 + look[1]}" r="2.5"/>`,
        paws: [[18, 41], [46, 41]],
      }),
    },
    bunny: {
      name: 'Bunny', line: 'Lives in a burrow and stays close to it. Long ears up over the sill; only their tips show when it ducks.',
      parts: (look) => ({
        fill: '<path d="M16 42A16 16 0 0 1 48 42Z"/><rect x="19.5" y="4" width="9" height="30" rx="4.5" transform="rotate(-9 24 19)"/><rect x="35.5" y="4" width="9" height="30" rx="4.5" transform="rotate(9 40 19)"/>',
        cut: `<rect x="22.4" y="9" width="3.2" height="17" rx="1.6" transform="rotate(-9 24 19)"/><rect x="38.4" y="9" width="3.2" height="17" rx="1.6" transform="rotate(9 40 19)"/><ellipse cx="${26.5 + look[0]}" cy="${34 + look[1]}" rx="2.3" ry="3.1"/><ellipse cx="${37.5 + look[0]}" cy="${34 + look[1]}" rx="2.3" ry="3.1"/><path d="M30 38.4H34L32 40.4Z"/>`,
        paws: [[21, 41], [43, 41]],
      }),
    },
    squirrel: {
      name: 'Squirrel', line: '“Squirrel away”: to keep something safe and out of sight. Its bushy tail curls up behind it.',
      parts: (look) => ({
        fill: '<path d="M36 41C52 40.5 59 27 54 14.5C49.5 4 35.5 4 33 12.5C31.5 18 37.5 21 41 16.5C45.5 23 44 32 36 35.5Z"/><path d="M11 42A15 15 0 0 1 41 42Z"/><path d="M13.6 33L14.5 21.5Q15 19.5 16.8 20.6L22.5 27Z"/><path d="M38.4 33L37.5 21.5Q37 19.5 35.2 20.6L29.5 27Z"/>',
        gap: '<circle cx="26" cy="42" r="16.6" fill="none" stroke="#000" stroke-width="2.6"/>',
        cut: `<ellipse cx="${21.5 + look[0]}" cy="${34 + look[1]}" rx="2.3" ry="3.1"/><ellipse cx="${30.5 + look[0]}" cy="${34 + look[1]}" rx="2.3" ry="3.1"/>`,
        paws: [[17, 41], [35, 41]],
      }),
    },
    bear: {
      name: 'Bear', line: 'Spends all winter at home in its den. Round ears, a snout, paws on the sill.',
      parts: (look) => ({
        fill: '<circle cx="17.5" cy="25" r="6"/><circle cx="46.5" cy="25" r="6"/><path d="M14 42A18 18 0 0 1 50 42Z"/>',
        cut: `<circle cx="17.5" cy="25" r="2.6"/><circle cx="46.5" cy="25" r="2.6"/><circle cx="${25.5 + look[0]}" cy="${31.5 + look[1]}" r="2.3"/><circle cx="${38.5 + look[0]}" cy="${31.5 + look[1]}" r="2.3"/><ellipse cx="32" cy="38.5" rx="6.6" ry="4.8"/>`,
        top: '<ellipse cx="32" cy="36.6" rx="2.6" ry="1.8"/>',
        paws: [[18, 41], [46, 41]],
      }),
    },
  };
  let n = 0;

  function mark(m, size, tone = 'var(--tide)', st = 'private', w = size, h = size, box = '0 0 64 64') {
    const k = 'm' + (++n), p = m.parts(st === 'ask' ? [1.8, -1.8] : [0, 0]);
    const body = `<g mask="url(#${k})">${p.fill}</g>${p.top || ''}`;
    return `<svg width="${w}" height="${h}" viewBox="${box}" style="color:${tone}" aria-hidden="true">
      <defs><mask id="${k}"><rect x="-10" y="-10" width="90" height="90" fill="#fff"/><g fill="#000">${p.cut}${p.gap || ''}</g></mask>
        <clipPath id="${k}c"><rect width="64" height="40.5"/></clipPath></defs>
      <g fill="currentColor" clip-path="url(#${k}c)">${st === 'shut' ? `<g transform="translate(0 15)">${body}</g>` : body}</g>
      <rect x="6" y="40" width="52" height="6" rx="3" fill="currentColor"/>
      ${st === 'shut' ? '' : p.paws.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.8" fill="currentColor"/>`).join('')}
    </svg>`;
  }

  function appIcon(m, size) {
    const k = 'i' + (++n), p = m.parts([0, 0]);
    return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="${k}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ad6de"/><stop offset="1" stop-color="#077a86"/></linearGradient>
        <linearGradient id="${k}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9f3f5"/></linearGradient>
        <linearGradient id="${k}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="${k}t"><rect x="4" y="4" width="92" height="92" rx="22"/></clipPath>
        <clipPath id="${k}c"><rect width="64" height="40.5"/></clipPath>
      </defs>
      <g clip-path="url(#${k}t)">
        <rect x="4" y="4" width="92" height="96" fill="url(#${k}g)"/>
        <g transform="translate(9.6 6.4) scale(1.3)" style="color:#fff">
          <g clip-path="url(#${k}c)"><g fill="url(#${k}f)">${p.fill}</g>${p.gap ? `<g style="stroke:#3fb5c0" fill="none">${p.gap.replace('stroke="#000"', '')}</g>` : ''}<g fill="#0b1620">${p.cut}</g><g fill="url(#${k}f)">${p.top || ''}</g></g>
        </g>
        <rect x="4" y="58.4" width="92" height="42" fill="#0b1620" fill-opacity=".86"/>
        <rect x="4" y="58.4" width="92" height="2" fill="#fff" fill-opacity=".25"/>
        ${p.paws.map(([x, y]) => `<circle cx="${9.6 + x * 1.3}" cy="${6.4 + y * 1.3}" r="5" fill="url(#${k}f)"/>`).join('')}
        <rect x="4" y="4" width="92" height="92" fill="url(#${k}s)"/>
      </g>
      <rect x="4.5" y="4.5" width="91" height="91" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".22"/>
    </svg>`;
  }

  const bar = (m, cls = 'glass') => `<div class="bar ${cls}">${['private', 'ask', 'shut'].map((st) => mark(m, 0, cls === 'dark' ? '#fff' : 'var(--ink)', st, 27, 18, '2 10 60 40')).join('')}</div>`;
  document.getElementById('opts').innerHTML = Object.entries(M).map(([id, m]) => `<article class="opt">
      <h2>${m.name}${id === 'cat' ? '' : ' <span class="pick">New</span>'}</h2>
      <div class="row"><span class="icon">${appIcon(m, 112)}</span>${mark(m, 72)}${mark(m, 40, 'var(--ask)', 'ask')}</div>
      ${bar(m)}${bar(m, 'dark')}
      <p>${m.line}</p></article>`).join('');
</script>
</body>
</html>
