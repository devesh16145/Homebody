[package]
name = "homebody-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Homebody core: destination rules, ask flow, signed ledger, local proxy, fence control"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
# Looking inside traffic to trusted places (see inspect.rs). ring, not aws-lc: no C toolchain needed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
webpki-roots = "1"
httparse = "1"
time = "0.3"

[target.'cfg(windows)'.dependencies]
# The Windows fence (app containers) is a handful of system calls; these are only their declarations.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
