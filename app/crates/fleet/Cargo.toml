[package]
name = "homebody-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Homebody fleet server: an organisation's own place for its rules and its computers' logs"

[[bin]]
name = "homebody-fleet"
path = "src/main.rs"

[dependencies]
homebody-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
httparse = "1"
ring = "0.17"

[dev-dependencies]
tempfile = "3"
