[package]
name = "homebody-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Homebody command line: talk to the running app, or run the engine headless"

[[bin]]
name = "homebody"
path = "src/main.rs"

[dependencies]
homebody-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde_json = "1"

# Already part of the build (the async runtime uses it); named here for waiting on and
# signalling the protected program (see `keep` in main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
