[package]
name = "sandbox-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandbox-ai desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
sai-core = { path = "../crates/core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal"] }
