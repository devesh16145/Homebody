[package]
name = "homebody-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Homebody desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
homebody-core = { path = "../crates/core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal"] }
